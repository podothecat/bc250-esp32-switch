; BC250 ESP32 power switch.
; The setup portal's web UI lives in app/index.html and is packed into the
; SPIFFS partition. Flash it with:  pio run -t uploadfs

[platformio]
data_dir = app

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
; Custom table: ~2.75MB app (WiFi + BLE + async web server) + SPIFFS for the UI.
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200
lib_deps =
	h2zero/NimBLE-Arduino@^2.2.3
	https://github.com/ESP32Async/ESPAsyncWebServer
	bblanchon/ArduinoJson@^7
	dawidchyrzynski/home-assistant-integration
	; Transitive dependency of ArduinoHA, declared explicitly: pinning the MQTT
	; client is worth one line, and PlatformIO's transitive resolution has known
	; gaps. If HA shows entities with missing attributes, the discovery payload is
	; being truncated -- add -D MQTT_MAX_PACKET_SIZE=512 to build_flags.
	knolleary/PubSubClient@^2.8

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-wroom32]
; Keep the USB-UART reset/boot control lines inactive while monitoring.
monitor_dtr = 0
monitor_rts = 0
; Generic ESP32 Dev Module, suitable for ESP32-WROOM-32 development boards.
board = esp32dev
; Bluepad32 HID host detects DualSense reconnections (C3 keeps NimBLE).
platform = espressif32@6.9.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
extra_scripts = post:scripts/bluepad32.py
build_flags = -D BC250_BLUEPAD32=1
lib_ignore = NimBLE-Arduino

; USB-only diagnostic build: `test <MAC>` uses a temporary controller binding.
[env:esp32-wroom32-test]
extends = env:esp32-wroom32
build_flags = ${env:esp32-wroom32.build_flags} -D BC250_SERIAL_TEST=1
